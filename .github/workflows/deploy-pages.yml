name: Deploy to GitHub Pages

# Publica el juego (exportación estática de Next.js) en https://<usuario>.github.io/<repositorio>/
# Requiere: Settings > Pages > Source = "GitHub Actions"

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compress the default car model
        run: node scripts/compress-car-glb.mjs --all
        continue-on-error: true

      - name: Build static export
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          FULL_REPO: ${{ github.repository }}
          NEXT_PUBLIC_BUILD: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          # Solo el repositorio llamado <usuario>.github.io se sirve en la raiz; cualquier otro vive en /<repositorio>
          if [ "$REPO_LC" = "$OWNER_LC.github.io" ]; then BASE=""; else BASE="/$REPO"; fi
          export NEXT_PUBLIC_BASE_PATH="$BASE"
          export NEXT_PUBLIC_SITE_URL="https://$OWNER_LC.github.io$BASE"
          export NEXT_PUBLIC_REPO_URL="https://github.com/$FULL_REPO"
          npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
