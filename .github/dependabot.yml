# Noryx is a personal copy: version-update pull requests are switched off (limit 0), so the repository does not fill
# with weekly PRs. Raise the limit (or restore the original file) to turn them back on.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
